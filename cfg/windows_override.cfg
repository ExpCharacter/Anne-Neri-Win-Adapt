// ======================================================================
//  Windows 平台专用覆盖配置
//  仅由 start_server.bat 通过 +exec windows_override.cfg 加载，
//  Linux 端启动方式不变，因此不会影响原有 Linux 行为。
//
//  注意：SourceMod 插件自动生成的 cfg/sourcemod/*.cfg 会在地图切换时重新
//        执行；如果某个 cvar 在这里覆盖后又被地图切换重置，请直接修改对应
//        插件生成的 cfg（例如 cfg/sourcemod/l4dscs.cfg）。
// ======================================================================

// ----------------------------------------------------------------------
// 1) survivor_chat_select（extend/survivor_chat_select.smx）
//    原始配置 cfg/sourcemod/l4dscs.cfg 中为：
//        // Prop for Zoey. 0: Rochelle (windows), 1: Zoey (linux), 2: Nick (fakezoey)
//        l4d_scs_zoey "1"
//    该插件自身注释指出 Zoey 道具索引与平台相关：Windows 下建议使用 0。
//    如果游戏内选人菜单里的 Zoey 道具显示异常，取消下面这行注释并生效：
// l4d_scs_zoey 0

// ----------------------------------------------------------------------
// 这里可以继续追加其它仅 Windows 需要的 cvar 覆盖，例如：
